[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapmcp"
version = "1.0.0"
description = "Scraping dan arsip materi: CLI Indonesia + MCP Xiaozhi"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tim ScrapMCP"}]
dependencies = [
 "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "httpx>=0.27,<1",
 "mcp>=1.12,<2", "websockets>=14,<16", "pypdf>=4,<7",
 "youtube-transcript-api>=1.2,<2", "reportlab>=4,<5", "filelock>=3.15,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
pdf-fast = ["PyMuPDF>=1.24,<2"]
[project.scripts]
scrapmcp = "scrapmcp.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
scrapmcp = ["fixtures/*.html", "fixtures/*.json"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
